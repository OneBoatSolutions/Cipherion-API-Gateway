syntax = "proto3";
package prototypeBuffer.v1;
option go_package = "cipsec/services/core/generated/v1;prototypeBufferV1";



service grpcCallBackfromNest {
  rpc CreateAndWrapNewProjectRootKey(createAndWrapNewProjectRootKey_Request) returns (createAndWrapNewProjectRootKey_Response);
  rpc CreateAndWrapNewProjectEncryptionKey(createAndWrapNewProjectEncryptionKey_Request) returns (createAndWrapNewProjectEncryptionKey_Response);
  rpc CreateAndWrapNewGroupRootKeyAndGroupDataEncryptionKey(CreateAndWrapNewGroupRootKeyAndGroupDataEncryptionKey_Request) returns (CreateAndWrapNewGroupRootKeyAndGroupDataEncryptionKey_Response);
  rpc CreateAndWrapNewDeviceGroupDataEncryptionKey(CreateAndWrapNewDeviceGroupDataEncryptionKey_Request) returns (CreateAndWrapNewDeviceGroupDataEncryptionKey_Response);
  rpc RotateWrappingKeyforProjectEncryptionKey(RotateWrappingKeyforProjectEncryptionKey_Request) returns (RotateWrappingKeyforProjectEncryptionKey_Response);
}

message createAndWrapNewProjectRootKey_Request {
    string ProjectId                = 1;    
}

message createAndWrapNewProjectRootKey_Response { 
    string ProjectId                = 1;
    string WrappedProjectRootKeyIV  = 2;
    string WrappedProjectRootKey    = 3; 
    string WrappedProjectRootKeyTag = 4;
}

message createAndWrapNewProjectEncryptionKey_Request {
    string ProjectId                = 1;
    string WrappedProjectRootKeyIV  = 2;
    string WrappedProjectRootKey    = 3; 
    string WrappedProjectRootKeyTag = 4;
    string UserPassphrase           = 5;
}

message createAndWrapNewProjectEncryptionKey_Response { 
    string ProjectId                        = 1;
    string WrappedProjectEncryptionKeyIV    = 2; 
    string WrappedProjectEncryptionKey      = 3; 
    string WrappedProjectEncryptionKeyTag   = 4;
    string UserPassphraseSalt               = 5; 
}

message CreateAndWrapNewGroupRootKeyAndGroupDataEncryptionKey_Request {
    string GroupId                          = 1;
    string WrappedProjectRootKeyIV          = 2;
    string WrappedProjectRootKey            = 3; 
    string WrappedProjectRootKeyTag         = 4;
    string WrappedProjectEncryptionKeyIV    = 5; 
    string WrappedProjectEncryptionKey      = 6; 
    string WrappedProjectEncryptionKeyTag   = 7;
    string UserPassphrase                   = 8;
    string UserPassphraseSalt               = 9; 
}

message CreateAndWrapNewGroupRootKeyAndGroupDataEncryptionKey_Response { 
    string GroupId                          = 1;
    string WrappedGroupRootKeyIV            = 2; 
    string WrappedGroupRootKey              = 3; 
    string WrappedGroupRootKeyTag           = 4;
    string WrappedGroupDataEncryptionKeyIV  = 5;
    string WrappedGroupDataEncryptionKey    = 6;
    string WrappedGroupDataEncryptionKeyTag = 7;
}


message CreateAndWrapNewDeviceGroupDataEncryptionKey_Request {
    string DeviceId                         = 1;
    string WrappedProjectRootKeyIV          = 2;
    string WrappedProjectRootKey            = 3; 
    string WrappedProjectRootKeyTag         = 4;
    string WrappedProjectEncryptionKeyIV    = 5; 
    string WrappedProjectEncryptionKey      = 6; 
    string WrappedProjectEncryptionKeyTag   = 7;
    string WrappedGroupRootKeyIV            = 8; 
    string WrappedGroupRootKey              = 9; 
    string WrappedGroupRootKeyTag           = 10;
    string WrappedGroupDataEncryptionKeyIV  = 11;
    string WrappedGroupDataEncryptionKey    = 12;
    string WrappedGroupDataEncryptionKeyTag = 13;
    string UserPassphrase                   = 14;
    string UserPassphraseSalt               = 15;
    string UserDevicePublicKey              = 16;
}

message CreateAndWrapNewDeviceGroupDataEncryptionKey_Response { 
    string DeviceId                               = 1;
    string WrappedDeviceGroupDataEncryptionKeyIV  = 2;
    string WrappedDeviceGroupDataEncryptionKey    = 3;
    string WrappedDeviceGroupDataEncryptionKeyTag = 4;
}

message RotateWrappingKeyforProjectEncryptionKey_Request {
    string ProjectId                        = 1;
    string CurrentUserPassphrase            = 2;
    string CurrentUserPassphraseSalt        = 3; 
    string NewUserPassphrase                = 4;
    string CurrentWrappedProjectRootKeyIV   = 5;
    string CurrentWrappedProjectRootKey     = 6;
    string CurrentWrappedProjectRootKeyTag  = 7;
    // The project encryption key as it is stored now (wrapped with the current passphrase).
    // Rotation unwraps it with the current passphrase and re-wraps it with the new one.
    string CurrentWrappedProjectEncryptionKeyIV  = 8;
    string CurrentWrappedProjectEncryptionKey    = 9;
    string CurrentWrappedProjectEncryptionKeyTag = 10;
}


message RotateWrappingKeyforProjectEncryptionKey_Response {
    string ProjectId                          = 1;
    string NewWrappedProjectEncryptionKeyIV   = 2;
    string NewWrappedProjectEncryptionKey     = 3; 
    string NewWrappedProjectEncryptionKeyTag  = 4;
    string NewUserPassphraseSalt              = 5;
}